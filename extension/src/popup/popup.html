<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width" />
<title>Caption AI — Controls</title>
<style>
  :root { color-scheme: dark; --primary:#9333ea; --second:#db2777; --bg:#0b0b0f; --surface:#18181b; --text:#f4f4f5; --muted:#a1a1aa; --border:#27272a;}
  * { box-sizing: border-box; }
  body { margin:0; padding:12px 16px; width:320px; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  h1 { font-size:16px; margin:0 0 10px; letter-spacing:0.02em; }
  .btn { display:inline-flex; align-items:center; justify-content:center; width:100%; padding:10px 0; border-radius:8px; border:none; font:inherit; font-weight:600; cursor:pointer; touch-action:manipulation; min-height:44px; outline:3px solid transparent; outline-offset:2px; }
  .btn:focus-visible { outline-color:#93c5fd; }
  .btn-primary { background:linear-gradient(135deg, var(--primary), #7e22ce); color:#fff; box-shadow:0 2px 8px rgba(147,51,234,0.35); }
  .btn-second { background:linear-gradient(135deg, var(--second), #be185d); color:#fff; margin-top:8px; box-shadow:0 2px 8px rgba(219,39,119,0.35); }
  .btn:active { transform:scale(0.99); }
  .status { margin-top:10px; padding:8px 10px; border-radius:6px; background:var(--surface); border:1px solid var(--border); font-size:12px; color:var(--muted); }
  .label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin:8px 0 4px; }
  .notice { margin-top:6px; font-size:12px; color:#facc15; }
</style>
</head>
<body>
  <h1>Caption AI</h1>
  <button id="toggle" class="btn btn-primary" aria-label="Toggle captions">Turn on Captions</button>
  <button id="info" class="btn btn-second" aria-label="Service info" aria-expanded="false" aria-controls="model-info">Service info</button>
  <div class="status" id="service-state" aria-live="polite">Checking caption services…</div>
  <div id="model-info" class="status" hidden>
    <div class="label">Model / Status</div>
    <div id="model-detail">No data yet.</div>
    <div class="notice">If errors occur, check the sidecar log (port 9000, 127.0.0.1).</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
