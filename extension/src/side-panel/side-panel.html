<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Caption AI — Giải nghĩa từ</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --muted: #666;
        --accent: #b8860b;
        --border: #d8d8d8;
        --warn-bg: #fff4d6;
        --warn-fg: #7a5200;
        --err-bg: #fde8e8;
        --err-fg: #8a1f1f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #ececec;
          --muted: #9a9a9a;
          --accent: #ffd84d;
          --border: #3a3a3a;
          --warn-bg: #3a2f12;
          --warn-fg: #ffd84d;
          --err-bg: #3a1c1c;
          --err-fg: #ff9c9c;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        color: var(--fg);
        font-size: 14px;
        line-height: 1.5;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
        font-weight: 600;
      }
      .word {
        font-size: 22px;
        font-weight: 700;
        color: var(--accent);
        word-break: break-word;
      }
      .context {
        color: var(--muted);
        font-size: 13px;
        margin: 4px 0 14px;
      }
      .row {
        margin: 8px 0;
      }
      .label {
        color: var(--muted);
        font-size: 12px;
      }
      .value {
        word-break: break-word;
      }
      .ipa {
        font-family: ui-monospace, monospace;
      }
      .placeholder,
      .note,
      .error {
        color: var(--muted);
        padding: 12px;
        border: 1px dashed var(--border);
        border-radius: 6px;
      }
      .error {
        color: var(--err-fg);
        background: var(--err-bg);
        border: 1px solid var(--err-fg);
      }
      .note {
        color: var(--warn-fg);
        background: var(--warn-bg);
        border-color: var(--warn-fg);
        border-style: solid;
      }
      button {
        font: inherit;
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--fg);
      }
    </style>
  </head>
  <body>
    <h1>Giải nghĩa từ</h1>
    <div id="content">Bấm vào một từ trong dòng phụ đề EN để xem nghĩa của nó.</div>
    <script src="side-panel.js"></script>
  </body>
</html>
